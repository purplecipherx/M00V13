name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/compile_cardigann_android.py'
      - 'indexers/definitions/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/compile_cardigann_android.py'
      - 'indexers/definitions/**'

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Cardigann Android catalog
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python tools/compile_cardigann_android.py
          cat indexers/android_compile_manifest.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install stable Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Prepare direct APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk M00V13.apk
      - uses: actions/upload-artifact@v4
        with:
          name: m00v13-debug-apk
          path: M00V13.apk
          if-no-files-found: error
      - name: Publish direct test APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build \
              --title 'M00V13 Test Build' \
              --notes 'Latest successful M00V13 Android TV debug build for device testing.'
          fi
          gh release upload test-build M00V13.apk --clobber
