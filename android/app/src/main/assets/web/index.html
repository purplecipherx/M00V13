<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>M00V13</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="cinema-screen">
  <div id="ambient" class="ambient"></div>
  <header class="topbar">
    <div class="brand"><div class="brand-name">M 0 0 V 1 3</div><div class="brand-sub">STORIES WITHOUT LIMITS</div></div>
    <div class="search-pill"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><input id="global-search" autocomplete="off" placeholder="What do you want to watch or scrape?"></div>
    <div class="top-user"><span id="clock">12:54 PM</span><button class="avatar" data-action="profile">P</button></div>
  </header>
  <aside id="nav" class="nav-rail" aria-label="M00V13 navigation">
    <button data-route="home" title="Home"><b>⌂</b><span>Home</span></button>
    <button data-route="movies" title="Movies"><b>▣</b><span>Movies</span></button>
    <button data-route="series" title="Series"><b>▤</b><span>Series</span></button>
    <button data-route="library" title="Library"><b>♡</b><span>Library</span></button>
    <button data-route="search" title="Search"><b>⌕</b><span>Search</span></button>
    <div class="nav-gap"></div>
    <button data-action="debrid" title="Debrid"><b>↗</b><span>Debrid</span></button>
    <button data-route="providers" title="Sources"><b>◉</b><span>Sources</span></button>
    <button data-route="donate" title="Support"><b>♥</b><span>Support</span></button>
    <button data-route="settings" title="Settings"><b>⚙</b><span>Settings</span></button>
  </aside>
  <main id="screen" class="screen-content"></main>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
